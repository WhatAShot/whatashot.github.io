name: Read legacy Busuanzi counter
on:
  push:
    paths:
      - '.github/workflows/read-legacy-counter.yml'
permissions:
  contents: read
jobs:
  read-counter:
    runs-on: ubuntu-latest
    steps:
      - name: Query legacy counter
        shell: bash
        run: |
          set -euo pipefail
          CALLBACK="BusuanziCallback_legacy"
          RESPONSE=$(curl -fsSL             -A "Mozilla/5.0"             -H "Referer: https://whatashot.github.io/"             "https://busuanzi.ibruce.info/busuanzi?jsonpCallback=$CALLBACK")
          echo "BUSUANZI_RESPONSE=$RESPONSE"
